name: V3.2 Buddy Stage1 experimental contract
on:
  pull_request:
    paths:
      - "experiments/buddy_runner_v1/**"
      - ".github/workflows/v32-buddy-stage1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage1 source-isolation and sealing adversarial tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s experiments/buddy_runner_v1 -p "test_*.py" -v 2>&1 | tee buddy-stage1-test.log
      - name: Preserve actual test output, including RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-stage1-test-log
          path: buddy-stage1-test.log
          if-no-files-found: warn
  runner-entry-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GitHub-hosted runner entered a shell
        shell: bash
        run: |
          echo "V32_BUDDY_RUNNER_HOST_ENTERED"
          python3 --version
