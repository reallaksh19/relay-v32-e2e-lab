name: V3.2 lab read-only source projection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'governance/**'
      - 'scripts/**'
      - '.github/workflows/delp-readonly.yml'
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Common V3.2 source
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 13989969f6b7e432c4f7c1ddfe975449dba53593
          token: ${{ secrets.COMMON_READ_TOKEN }}
          path: .protocol/common
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML
      - name: Verify pin and released plan
        run: |
          test "$(git -C .protocol/common rev-parse HEAD)" = '13989969f6b7e432c4f7c1ddfe975449dba53593'
          python scripts/check_graph.py --engine .protocol/common/skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py --live-readonly
        env:
          GH_TOKEN: ${{ github.token }}
      - name: OFFLINE projection adversarial assertions only
        run: python stress/run_v32.py --engine .protocol/common/skills/engineering-pr-delivery-v3.2/scripts/delp_projection_v32.py
